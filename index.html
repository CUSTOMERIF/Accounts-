<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0757c8">

  <title>QUẢN LÝ TÀI KHOẢN FOODS</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FOODS">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#f4f7fc;color:#193454;font:16px/1.5 Arial,Helvetica,sans-serif}
    button,a{font:inherit}

    .bar{
      height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
      background:#fff;border-bottom:1px solid #e1e8f2
    }
    .brand{font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
    button,a.action{
      border:1px solid #dae3f0;border-radius:8px;background:#fff;color:#0757c8;
      padding:7px 10px;text-decoration:none;cursor:pointer;white-space:nowrap;font-size:13px
    }
    .install{background:#0757c8!important;color:#fff!important;border-color:#0757c8!important}
    button:disabled{opacity:.55;cursor:default}
    button:focus-visible,a:focus-visible{outline:3px solid #80aff8;outline-offset:2px}

    #frameHost{width:100%;height:calc(100vh - 58px);height:calc(100dvh - 58px);background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}

    .loading{
      position:fixed;inset:58px 0 0;display:grid;place-items:center;padding:22px;
      background:#f4f7fc;z-index:50
    }
    .card{
      width:min(100%,430px);padding:34px 24px;text-align:center;background:#fff;
      border:1px solid #e1e8f2;border-radius:20px;box-shadow:0 16px 50px rgba(29,70,118,.07)
    }
    .mark{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 20px;border-radius:18px;background:#0757c8;color:#fff;font-size:29px;font-weight:800}
    h1{font-size:23px;margin:0 0 10px}
    p{color:#73839b;font-size:14px;margin:0 0 20px}
    .spinner{width:28px;height:28px;margin:0 auto 19px;border:3px solid #e2ebfb;border-top-color:#0757c8;border-radius:50%;animation:spin .9s linear infinite}
    .help{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
    .primary{background:#0757c8!important;color:#fff!important;border-color:#0757c8!important}
    [hidden]{display:none!important}

    dialog{
      width:min(92vw,480px);border:0;border-radius:18px;padding:0;color:#193454;
      box-shadow:0 24px 90px rgba(20,45,80,.30)
    }
    dialog::backdrop{background:rgba(19,43,84,.50)}
    .modal{padding:24px}
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}
    .modal h2{margin:0 0 8px;font-size:22px}
    .modal p{margin:0 0 14px}
    .steps{margin:12px 0 20px;padding-left:22px;color:#425a76}
    .steps li{margin:8px 0}
    .close{border:0;background:#eef3fa;color:#24496f;border-radius:8px;padding:7px 10px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}

    @media(max-width:650px){
      .bar{height:54px;padding-top:8px;padding-bottom:8px}
      .brand{font-size:12px}
      .actions{gap:5px}
      button,a.action{font-size:11px;padding:6px 7px}
      #frameHost{height:calc(100vh - 54px);height:calc(100dvh - 54px)}
      .loading{inset:54px 0 0;padding:16px}
      .card{padding:28px 18px}
    }

    @media(display-mode:standalone){
      #install{display:none!important}
    }
  </style>
</head>

<body>
  <header class="bar">
    <span class="brand">FOODS · QUẢN LÝ TÀI KHOẢN</span>
    <div class="actions">
      <button id="install" class="install" type="button">Cài ứng dụng</button>
      <button id="reload" type="button" disabled>Tải lại</button>
      <a id="direct" class="action" target="_blank" rel="noopener noreferrer" hidden>Mở trực tiếp ↗</a>
    </div>
  </header>

  <section id="loading" class="loading" aria-live="polite">
    <div class="card">
      <div class="mark" aria-hidden="true">F</div>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <h1 id="title">Đang mở ứng dụng</h1>
      <p id="message">Đang tải trang quản lý tài khoản…</p>
      <div id="help" class="help" hidden>
        <a id="openApp" class="action primary" target="_blank" rel="noopener noreferrer">Mở trực tiếp ↗</a>
        <button id="showFrame" type="button">Xem khung ứng dụng</button>
      </div>
    </div>
  </section>

  <main id="frameHost"></main>

  <dialog id="installHelp">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2>Cài ứng dụng FOODS</h2>
          <p id="installText">Làm theo hướng dẫn của trình duyệt.</p>
        </div>
        <button id="closeInstall" class="close" type="button" aria-label="Đóng">×</button>
      </div>
      <ol id="installSteps" class="steps"></ol>
      <div class="modal-actions">
        <button id="closeInstall2" type="button">Đóng</button>
      </div>
    </div>
  </dialog>

  <noscript>Bạn cần bật JavaScript để sử dụng ứng dụng.</noscript>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbz0Yg86ZxsLEMHWwtFLPccP_0VJz_lYXR1U_LNgxI_i50jqaZ1B159MVFaJq7spaqjZ9Q/exec';
    const $ = id => document.getElementById(id);

    let appUrl;
    let timer;
    let deferredInstall = null;

    const isStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    function setInstallHelp() {
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua);
      const isAndroid = /Android/i.test(ua);
      const isMac = /Macintosh|Mac OS X/.test(ua);

      const steps = $('installSteps');
      steps.replaceChildren();

      let items;
      if (isIOS) {
        $('installText').textContent = 'Trên iPhone/iPad, cài từ menu Chia sẻ của trình duyệt.';
        items = [
          'Mở trang GitHub Pages này trong trình duyệt.',
          'Bấm nút Chia sẻ.',
          'Chọn “Thêm vào Màn hình chính”.',
          'Bấm “Thêm”.'
        ];
      } else if (isAndroid) {
        $('installText').textContent = 'Nếu nút cài tự động chưa hiện, dùng menu của trình duyệt.';
        items = [
          'Mở menu ⋮ của Chrome/Samsung Internet.',
          'Chọn “Cài ứng dụng” hoặc “Thêm vào màn hình chính”.',
          'Xác nhận cài đặt.'
        ];
      } else if (isMac) {
        $('installText').textContent = 'Chrome/Edge có thể cài trực tiếp. Safari mới hỗ trợ “Add to Dock”.';
        items = [
          'Chrome/Edge: chọn biểu tượng cài trên thanh địa chỉ hoặc menu → Cài ứng dụng.',
          'Safari: File → Add to Dock.',
          'Xác nhận để thêm ứng dụng.'
        ];
      } else {
        $('installText').textContent = 'Trên máy tính, Chrome hoặc Edge hỗ trợ cài PWA trực tiếp.';
        items = [
          'Mở trang bằng Chrome hoặc Microsoft Edge.',
          'Bấm biểu tượng cài ứng dụng trên thanh địa chỉ hoặc menu trình duyệt.',
          'Chọn “Cài đặt”.'
        ];
      }

      items.forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        steps.append(li);
      });
    }

    async function installApp() {
      if (isStandalone()) {
        $('install').hidden = true;
        return;
      }

      if (deferredInstall) {
        const promptEvent = deferredInstall;
        deferredInstall = null;
        try {
          const result = await promptEvent.prompt();
          if (result && result.outcome === 'accepted') {
            $('install').hidden = true;
          }
        } catch (_) {}
        return;
      }

      setInstallHelp();
      $('installHelp').showModal();
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstall = event;
      if (!isStandalone()) $('install').hidden = false;
    });

    window.addEventListener('appinstalled', () => {
      deferredInstall = null;
      $('install').hidden = true;
    });

    $('install').addEventListener('click', installApp);
    $('closeInstall').addEventListener('click', () => $('installHelp').close());
    $('closeInstall2').addEventListener('click', () => $('installHelp').close());

    if (isStandalone()) $('install').hidden = true;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function start() {
      clearTimeout(timer);

      $('loading').hidden = false;
      $('spinner').hidden = false;
      $('help').hidden = true;
      $('title').textContent = 'Đang mở ứng dụng';
      $('message').textContent = 'Đang tải trang quản lý tài khoản…';

      const frame = document.createElement('iframe');
      frame.title = 'QUẢN LÝ TÀI KHOẢN FOODS';
      frame.allow = 'clipboard-read; clipboard-write; fullscreen';
      frame.allowFullscreen = true;
      frame.referrerPolicy = 'strict-origin-when-cross-origin';

      frame.addEventListener('load', () => {
        clearTimeout(timer);
        $('loading').hidden = true;
      });

      frame.src = appUrl.href;
      $('frameHost').replaceChildren(frame);

      timer = setTimeout(() => {
        $('spinner').hidden = true;
        $('title').textContent = 'Bạn chưa thấy ứng dụng?';
        $('message').textContent =
          'Nếu Google yêu cầu đăng nhập hoặc ứng dụng không hiển thị trong khung, hãy chọn Mở trực tiếp.';
        $('help').hidden = false;
      }, 12000);
    }

    try {
      appUrl = new URL(APP_URL);

      const valid =
        appUrl.protocol === 'https:' &&
        appUrl.hostname === 'script.google.com' &&
        /^\/macros\/s\/[^/]+\/exec\/?$/.test(appUrl.pathname);

      if (!valid) throw new Error('APP_URL không hợp lệ');

      $('direct').href = appUrl.href;
      $('openApp').href = appUrl.href;
      $('direct').hidden = false;
      $('reload').disabled = false;

      $('reload').addEventListener('click', start);
      $('showFrame').addEventListener('click', () => {
        $('loading').hidden = true;
      });

      start();

    } catch (error) {
      $('spinner').hidden = true;
      $('title').textContent = 'Link ứng dụng không hợp lệ';
      $('message').textContent =
        'Hãy kiểm tra lại đường dẫn Google Apps Script. Link phải kết thúc bằng /exec.';
      $('help').hidden = false;
    }
  </script>
</body>
</html>
